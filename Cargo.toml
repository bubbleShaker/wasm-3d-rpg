[package]
name = "wasm-3d-rpg"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui", "audio", "wav"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "HtmlElement"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 動作確認用の速いビルド (trunk build --release --cargo-profile fast)
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16

[features]
dev = ["bevy/debug"]
